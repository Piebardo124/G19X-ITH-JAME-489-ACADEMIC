services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    environment:
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
